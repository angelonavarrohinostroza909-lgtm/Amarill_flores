<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores para Andrea 🌻</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: white;
            font-family: 'Courier Prime', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            padding: 20px;
            z-index: 10;
        }

        .titulo {
            font-size: 32px;
            font-weight: 700;
            color: #FFFF00;
            text-shadow: 0 0 10px #FFFF00, 0 0 20px #FFFF00, 0 0 30px #FFFF00;
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .subtitulo {
            font-size: 18px;
            color: #FFFF00;
            text-shadow: 0 0 5px #FFFF00;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .regalo-text {
            font-size: 16px;
            text-transform: uppercase;
            margin-bottom: 40px;
            letter-spacing: 1px;
            color: white;
            text-shadow: 0 0 5px white;
        }

        .btn-container {
            border: 2px solid #FF00FF;
            box-shadow: 0 0 10px #FF00FF, inset 0 0 10px #FF00FF;
            padding: 10px 20px;
            display: inline-block;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }

        .btn-container:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px #FF00FF, inset 0 0 15px #FF00FF;
        }

        .btn-text {
            color: #FF00FF;
            text-shadow: 0 0 5px #FF00FF;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="titulo">Feliz día de las<br>flores amarillas</div>
        <div class="subtitulo">Amiga mía</div>
        <div class="regalo-text">Tengo un regalo<br>especial para ti</div>
        
        <a href="index1.html" class="btn-container">
            <span class="btn-text">Ver tu regalo</span>
        </a>
    </div>
</body>
</html>
